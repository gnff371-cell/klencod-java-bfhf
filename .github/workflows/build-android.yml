name: Build Android Java APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: klencod-java-${{ github.repository }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platforms;android-34
            build-tools;34.0.0
          accept-android-sdk-licenses: true

      - name: Check project files
        run: |
          echo "Checking project..."
          ls -la
          echo "Checking Gradle files..."
          find . -maxdepth 3 \( -name "gradlew" -o -name "settings.gradle" -o -name "settings.gradle.kts" -o -name "build.gradle" -o -name "build.gradle.kts" \)

      - name: Build Debug APK
        shell: bash
        run: |
          set -o pipefail

          if [ ! -f gradlew ]; then
            echo "ERROR: gradlew is missing."
            echo "The project must include its Gradle Wrapper."
            exit 1
          fi

          chmod +x gradlew

          ./gradlew --version

          ./gradlew \
            --no-daemon \
            --stacktrace \
            --info \
            :app:assembleDebug \
            -x lint \
            -x test 2>&1 | tee "$RUNNER_TEMP/gradle.log"

      - name: Show full errors
        if: failure()
        run: |
          echo "========== BUILD ERROR =========="
          if [ -f "$RUNNER_TEMP/gradle.log" ]; then
            tail -n 250 "$RUNNER_TEMP/gradle.log"
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: klencod-java-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7