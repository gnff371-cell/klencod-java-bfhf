name: Build Android Java APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: klencod-java-${{ github.repository }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Check project files
        shell: bash
        run: |
          echo "Checking project files..."
          ls -la

          if [ ! -f gradlew ]; then
            echo "ERROR: Gradle Wrapper (gradlew) is missing!"
            exit 1
          fi

          if [ ! -d app ]; then
            echo "ERROR: app directory is missing!"
            exit 1
          fi

      - name: Build Debug APK
        shell: bash
        run: |
          set -o pipefail

          chmod +x gradlew

          echo "Checking Gradle version..."
          ./gradlew --version

          echo "Starting Android APK build..."

          ./gradlew \
            --no-daemon \
            --stacktrace \
            --build-cache \
            :app:assembleDebug \
            -x lint \
            -x test 2>&1 | tee "$RUNNER_TEMP/gradle.log"

      - name: Show build errors
        if: failure()
        shell: bash
        run: |
          echo "========== BUILD FAILURE DETAILS =========="

          if [ -f "$RUNNER_TEMP/gradle.log" ]; then
            tail -n 250 "$RUNNER_TEMP/gradle.log"
          else
            echo "Gradle did not start or SDK setup failed."
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: klencod-java-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
